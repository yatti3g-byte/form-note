<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>フォームノート</title>

<meta property="og:type" content="website">
<meta property="og:title" content="フォームノート">
<meta property="og:description" content="コマ送り、角度の測定、2画面での比較ができる無料の野球フォームチェックツール。動画は端末の中だけで処理されます。">
<meta property="og:url" content="https://yatti3g-byte.github.io/form-note/">
<meta property="og:image" content="https://yatti3g-byte.github.io/form-note/og.jpg">

<style>
:root{--bg:#eef2ee;--panel:#fff;--line:#c9d4cc;--ink:#14201c;--mute:#5b6d64;--acc:#0f6b4a;--accInk:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a16;--panel:#18251f;--line:#2b3d35;--ink:#e6efe9;--mute:#93a79c;--acc:#ffd23f;--accInk:#14201c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a16;--panel:#18251f;--line:#2b3d35;--ink:#e6efe9;--mute:#93a79c;--acc:#ffd23f;--accInk:#14201c;color-scheme:dark}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;display:flex;flex-direction:column;gap:6px;padding:6px;box-sizing:border-box}
.panes{display:grid;grid-template-columns:1fr;gap:6px;flex:1;min-height:0}
.panes.two{grid-template-columns:1fr 1fr}
.panes.two.rows{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
.panes{min-height:250px}.panes.two.rows{min-height:420px}
.pane{display:flex;flex-direction:column;gap:4px;min-height:0;min-width:0}
[hidden]{display:none!important}
.bar{display:flex;align-items:center;gap:8px}
.bar b{width:1.6em;height:1.6em;display:grid;place-items:center;border-radius:50%;background:var(--line)}
.pane.act .bar b{background:var(--acc);color:var(--accInk)}
.bar{flex-wrap:wrap}
.bar label.btn{flex:0 0 auto;max-width:100%;white-space:nowrap}
.ls{display:none}
/* 2画面を左右に並べるときは幅が狭いので、短い表記にして1行に収める */
.panes.two:not(.rows) .lf{display:none}
.panes.two:not(.rows) .ls{display:inline}
.name{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 5em;min-width:0}
.nav{display:flex;align-items:center;gap:4px;margin-left:auto}
.nav .btn{padding:0 .7rem;justify-content:center}
.cnt{font-size:13px;color:var(--mute);min-width:2.8em;text-align:center}
.btn:disabled{opacity:.35;cursor:default}
.stage{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:relative;flex:1;min-height:160px;background:#000;border-radius:8px;overflow:hidden}
.pane.act .stage{outline:2px solid var(--acc);outline-offset:-2px}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.empty{position:absolute;inset:0;margin:0;display:grid;place-items:center;text-align:center;color:#9aa;padding:1rem;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn,select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:0 .8rem;font:inherit;min-height:44px;display:inline-flex;align-items:center;cursor:pointer}
.btn.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=color]{width:44px;height:44px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
input[type=range]{flex:1;min-width:120px;accent-color:var(--acc);height:44px}
.t{color:var(--mute);font-size:13px;flex:0 0 auto;width:10.5em;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
#rel{width:auto;flex:none;align-self:stretch;min-height:1.5em;text-align:left;overflow:hidden;text-overflow:ellipsis}
.anc{display:contents}
label.chk{display:inline-flex;align-items:center;gap:6px;min-height:44px}
#snapbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:flex-start;padding:12px;z-index:9;color:#fff;text-align:center;overflow:auto}
#snapbox[hidden]{display:none}
#snapbox img{max-width:100%;max-height:52vh;object-fit:contain;flex:0 0 auto}
#snapbox.ai img{max-height:30vh}
#snapbox .hint{margin:0;font-size:13px;color:#cfd8d3}
.seg{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.seg label{color:#fff;font-size:14px}
#aipanel{display:flex;flex-direction:column;gap:6px;width:100%;max-width:520px}
#aipanel input,#aipanel select,#aipanel textarea,.seg select{font:inherit;font-size:14px;padding:6px;border-radius:8px;border:1px solid #6a7a73;background:#fff;color:#14201c;max-width:100%}
#aipanel input{flex:1;min-width:0}
#aipanel textarea{width:100%;box-sizing:border-box;resize:vertical}
#aimsg{font-size:13px;color:#ffd23f;min-height:1.3em}
a.lnk{color:var(--mute);font-size:14px;padding:10px 8px;text-decoration:underline;white-space:nowrap}
.ctl{display:flex;flex-direction:column;gap:6px;width:100%;max-width:640px;margin:0 auto}
.ctl .btn,.ctl select{width:100%;justify-content:center;box-sizing:border-box;padding:0 .4rem;white-space:nowrap}
.g-tools{display:grid;grid-template-columns:1fr 1fr 1.7fr 48px;gap:6px;grid-area:tools}
.g-tools input[type=color]{width:100%;min-width:0;box-sizing:border-box}
.g-edit{display:grid;grid-template-columns:5.2em 6em 1fr;gap:6px;align-items:center;grid-area:edit}
.hintline{font-size:12px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-play{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:6px;grid-area:play}
.g-seek{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;grid-area:seek}
.g-seek input[type=range]{min-width:0;width:100%;margin:0}
.g-set{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:6px;grid-area:set}
.g-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;grid-area:pair}
.g-pair .chk{grid-column:1/-1;min-height:36px;justify-content:flex-start;white-space:nowrap}
.chk input{accent-color:var(--acc);width:20px;height:20px}
.g-act{display:grid;grid-template-columns:1.35fr 1fr auto;gap:6px;align-items:center;grid-area:act}
.g-act #aimain{font-weight:700}
details.draw{grid-area:draw;border-top:1px solid var(--line);padding-top:4px}
details.draw summary{cursor:pointer;color:var(--mute);font-size:14px;padding:10px 4px;list-style:none;display:flex;align-items:center;gap:6px}
details.draw summary::-webkit-details-marker{display:none}
details.draw summary::before{content:'▸';display:inline-block;transition:transform .15s}
details.draw[open] summary::before{transform:rotate(90deg)}
details.draw[open]{display:flex;flex-direction:column;gap:6px}
details.draw:not([open]) .g-tools,details.draw:not([open]) .g-edit{display:none}
.aimode #m1,.aimode #m4,.aimode #snapshare{display:none}
#rel{grid-area:rel;font-size:12px}
@media (orientation:landscape) and (max-height:560px){
  .stage{min-height:110px}.panes{min-height:160px}.panes.two.rows{min-height:320px}
  .ctl{max-width:none;display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"play seek" "set rel" "pair act" "tut draw";align-items:start}
  .g-tut{justify-content:flex-start}.g-tut .tl{display:none}.g-pair{grid-template-columns:1.5fr 1fr 1fr}.g-pair .chk{grid-column:auto}.g-tut .lnk{min-height:36px}details.draw summary{padding:6px 4px}
}

.g-tut{grid-area:tut;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 4px;font-size:14px;color:var(--mute)}
.g-tut .tl{flex-basis:100%;text-align:center;margin-top:2px}.g-tut .lnk{padding:0 10px}
.g-tut .lnk{background:none;border:0;font:inherit;font-size:14px;cursor:pointer;color:var(--accent,#0f6b4b);min-height:44px}
#tutmask{position:fixed;z-index:30;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.6);outline:3px solid #ffd23f;pointer-events:none;transition:all .2s}
#tutcard{position:fixed;left:12px;right:12px;max-width:520px;margin:0 auto;z-index:31;background:#fff;color:#1b2b24;border-radius:12px;padding:14px 16px;box-shadow:0 6px 24px rgba(0,0,0,.4);font-size:15px;line-height:1.6}
#tutcard h3{margin:0 0 4px;font-size:16px}
#tutcard p{margin:0 0 10px;line-height:1.7;word-break:auto-phrase;text-wrap:pretty;line-break:strict}
#tutcard .row{display:flex;gap:8px;align-items:center}
#tutcard .row .grow{flex:1;font-size:12px;color:#5b6b63}
#tutcard button{color:#1b2b24;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #c9d3cd;background:#fff;font:inherit;cursor:pointer}
#tutcard button.go{background:#0f6b4b;color:#fff !important;border-color:#0f6b4b;font-weight:700}
#tutcard button:disabled{opacity:.4}
#tutbn{max-width:640px;margin:0 auto 6px;background:#0f6b4b;color:#fff;border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#tutbn span{flex:1}.nb{white-space:nowrap}#tutbn button{min-height:44px;border-radius:8px;border:1px solid #fff;background:transparent;color:#fff;font:inherit;padding:0 12px;cursor:pointer}
#tutbn[hidden],#tutmask[hidden],#tutcard[hidden]{display:none!important}
#tutbn button.go{background:#fff;color:#0f6b4b;font-weight:700}
.g-sup{text-align:center}.g-sup[hidden]{display:none}.g-sup .lnk{display:inline-block;min-height:44px}
@media (orientation:landscape) and (max-height:560px){.g-sup{display:none}}
</style>

<body>
<div id="tutbn" hidden><span><span class="nb">はじめての方へ：</span><span class="nb">AIに相談するまでを</span><span class="nb">案内します</span></span><button class="go" id="tutgo">見てみる</button><button id="tutno" aria-label="閉じる">×</button></div>
<div class="panes" id="panes"></div>

<div class="ctl">
  <div class="g-play">
    <button class="btn" id="prev" aria-label="1コマ戻る">◀ 1コマ</button>
    <button class="btn" id="play">再生</button>
    <button class="btn" id="next" aria-label="1コマ進む">1コマ ▶</button>
  </div>
  <div class="g-seek">
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="再生位置">
    <span class="t" id="time">0.00 / 0.00 秒</span>
  </div>
  <div class="t" id="rel" hidden></div>
  <div class="g-set">
    <select id="speed" aria-label="再生速度">
      <option value="0.1">0.1倍</option><option value="0.25" selected>0.25倍</option><option value="0.5">0.5倍</option><option value="1">1倍</option>
    </select>
    <select id="fps" aria-label="撮影したときのfps（動画のコマ数）">
      <option value="24">24fps</option><option value="30" selected>30fps</option><option value="60">60fps</option><option value="120">120fps</option><option value="240">240fps</option>
    </select>
    <button class="btn" id="cmp">2画面で比較</button>
  </div>
  <div class="g-pair" id="pairrow" hidden>
    <label class="chk" id="linkw" hidden><input type="checkbox" id="link" checked>A・B連動（同時に動かす）</label>
    <span class="anc" hidden><button class="btn" id="anchor" disabled>ここを基準に同期</button><button class="btn" id="goanchor" disabled>基準へ戻る</button></span>
  </div>
  <div class="g-act">
    <button class="btn on" id="aimain">AIに相談</button>
    <button class="btn" id="snap">保存・共有</button>
    <a class="lnk" href="help.html" target="_blank" rel="noopener">使い方</a>
  </div>
  <div class="g-tut"><span class="tl">はじめての方へ：</span><button class="lnk" id="tutbtn">1本の動画でAI相談</button><button class="lnk" id="tutbtn2">2画面で比べてAI相談</button></div>
  <details class="draw" id="draw">
    <summary>描画ツール（線・角度）</summary>
    <div class="g-tools" id="tools">
      <button class="btn on" data-tool="line">直線</button>
      <button class="btn" data-tool="angle">角度</button>
      <button class="btn" data-tool="pen">フリーハンド</button>
      <input type="color" id="col" value="#ffd23f" aria-label="線の色">
    </div>
    <div class="g-edit">
      <button class="btn" id="undo">戻す</button>
      <button class="btn" id="clear">全消去</button>
      <span class="hintline" id="toolhint">2点をドラッグして線を引く</span>
    </div>
  </details>
  <div class="g-sup" hidden><a class="lnk" id="supportlink" href="#" target="_blank" rel="noopener">☕ 開発を支援する</a></div>
</div>

<div id="tutmask" hidden></div><div id="tutcard" hidden role="dialog" aria-live="polite"></div>
<div id="snapbox" hidden>
  <div class="seg"><button class="btn on" id="m1">いまの場面</button><button class="btn" id="m4">前後4枚</button><label id="ivw" hidden>間隔 <select id="burstiv"><option value="1">1コマ</option><option value="2">2コマ</option><option value="3">3コマ</option><option value="5" selected>5コマ</option><option value="10">10コマ</option><option value="15">15コマ</option><option value="30">30コマ</option></select></label></div>
  <img id="snapimg" alt="静止画">
  <p class="hint" id="snaphint">画像を長押しして保存できます。</p>
  <div class="row" style="justify-content:center"><button class="btn on" id="snapshare" hidden>共有する</button><button class="btn" id="snapclose">閉じる</button></div>
  <div id="aipanel" hidden>
    <div class="row" style="justify-content:center"><select id="aikind"><option>打者（スイング）</option><option>投手（投球）</option></select><input id="aictx" type="text" maxlength="80" placeholder="年齢・左右・悩み"></div>
    <select id="aipair" hidden><option value="">A・Bの関係：指定しない</option><option value="self">どちらも自分（日付や調子の比較）</option><option value="AM">Aが自分・Bがお手本</option><option value="MA">Aがお手本・Bが自分</option></select>
    <textarea id="aitext" rows="6" aria-label="AIへの質問文"></textarea>
    <button class="btn on" id="aisend">質問文をコピーして、AIアプリに送る</button>
    <div id="aimsg" role="status"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
let tool='line',active=0,compare=false;

function rect(p){
  const vw=p.v.videoWidth||16,vh=p.v.videoHeight||9,cw=p.c.clientWidth,ch=p.c.clientHeight;
  const s=Math.min(cw/vw,ch/vh),w=vw*s,h=vh*s;
  return{x:(cw-w)/2,y:(ch-h)/2,w,h};
}
function draw(x,list,R,lw){
  const P=q=>[R.x+q[0]*R.w,R.y+q[1]*R.h];
  x.lineCap='round';x.lineJoin='round';
  for(const s of list){
    x.strokeStyle=x.fillStyle=s.col;x.lineWidth=lw;x.beginPath();
    const pts=s.p.map(P);
    pts.forEach((q,k)=>k?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.stroke();
    if(s.t==='angle'){
      pts.forEach(q=>{x.beginPath();x.arc(q[0],q[1],lw*1.6,0,7);x.fill()});
      if(pts.length===3){
        const[a,b,c]=pts;
        let d=Math.abs(Math.atan2(a[1]-b[1],a[0]-b[0])-Math.atan2(c[1]-b[1],c[0]-b[0]))*180/Math.PI;
        if(d>180)d=360-d;
        const tx=d.toFixed(0)+'°';
        x.font='bold '+lw*7+'px sans-serif';x.lineWidth=lw*1.6;x.strokeStyle='#000';
        x.strokeText(tx,b[0]+lw*3,b[1]-lw*3);x.fillText(tx,b[0]+lw*3,b[1]-lw*3);
      }
    }
  }
}
function redraw(p){
  p.x.clearRect(0,0,p.c.clientWidth,p.c.clientHeight);
  draw(p.x,p.shapes.concat(p.cur?[p.cur]:[],p.pend?[p.pend]:[]),rect(p),3);
}
function fit(p){
  const d=devicePixelRatio||1;
  p.c.width=p.c.clientWidth*d;p.c.height=p.c.clientHeight*d;
  p.x.setTransform(d,0,0,d,0,0);redraw(p);
}
function nrm(p,e){
  const r=p.c.getBoundingClientRect(),R=rect(p);
  const cl=v=>Math.min(1,Math.max(0,v));
  return[cl((e.clientX-r.left-R.x)/R.w),cl((e.clientY-r.top-R.y)/R.h)];
}

const panes=[0,1].map(i=>{
  const el=document.createElement('section');el.className='pane';
  el.innerHTML='<div class="bar"><b>'+'AB'[i]+'</b><label class="btn" aria-label="動画を選ぶ"><span class="lf">動画を選ぶ</span><span class="ls">選ぶ</span><input type="file" accept="video/*" multiple hidden></label><span class="name">未選択</span><span class="nav" hidden><button type="button" class="btn" data-d="-1" aria-label="前の動画">◀</button><span class="cnt"></span><button type="button" class="btn" data-d="1" aria-label="次の動画">▶</button></span></div>'+
  '<div class="stage"><video playsinline muted preload="metadata"></video><canvas></canvas><p class="empty">「動画を選ぶ」から<br>スマホ内の動画を開きます</p></div>';
  $('#panes').append(el);
  const p={i,el,v:el.querySelector('video'),c:el.querySelector('canvas'),shapes:[],cur:null,pend:null,list:[],pos:0};
  p.x=p.c.getContext('2d');
  /* 複数の動画をまとめて選べる。◀ ▶ で前後の動画へすばやく切り替える(切り替えると書き込みは消える) */
  const navUI=()=>{const nv=el.querySelector('.nav'),n=p.list.length,[b0,b1]=nv.querySelectorAll('button');
    nv.hidden=n<2;el.querySelector('.cnt').textContent=(p.pos+1)+'/'+n;b0.disabled=p.pos<=0;b1.disabled=p.pos>=n-1};
  const open=n=>{
    const f=p.list[n];if(!f)return;p.pos=n;
    LK=null;if(p.url)URL.revokeObjectURL(p.url);
    p.url=URL.createObjectURL(f);p.off=0;p.pts=null;p.first=true;
    p.v.src=p.url;
    el.querySelector('.name').textContent=f.name;
    el.querySelector('.empty').hidden=true;
    p.shapes=[];p.pend=null;p.cur=null;p.anchor=null;setActive(i);navUI();ancUI();
  };
  el.querySelector('input').onchange=e=>{const fs=[...e.target.files];if(!fs.length)return;p.list=fs;open(0);e.target.value=''};
  el.querySelectorAll('.nav button').forEach(bt=>bt.onclick=()=>open(p.pos+(+bt.dataset.d)));
  const bad=()=>{const m=el.querySelector('.empty');m.innerHTML='この動画は再生できません<br>この端末が対応していない形式の可能性があります';m.hidden=false};
  p.v.onerror=()=>{if(p.v.getAttribute('src'))bad()};
  p.v.onloadedmetadata=()=>{if(!p.v.videoWidth){bad();return}layout();redraw(p);sync();ancUI()};
  /* 表示中のコマの時刻(pts)を常に記録する。スライダーや再生停止のあと、任意の時刻から正確に1コマ動かすため */
  p.pts=null;p.first=true;
  p.wait=[];
  const tick=(n,m)=>{p.pts=m.mediaTime;p.stale=false;if(p.first){p.off=m.mediaTime||0;p.first=false}p.wait.splice(0).forEach(f=>f());p.v.requestVideoFrameCallback(tick)};
  /* シーク直後は、新しいコマの時刻が届くまで「未確定」。コマ送りが自分で指定した位置(tgt)への移動なら、待たずに進める */
  p.v.addEventListener('seeking',()=>{p.stale=true;p.mid=Math.abs(p.v.currentTime-(p.tgt??-1))<1e-3});
  if(p.v.requestVideoFrameCallback)p.v.requestVideoFrameCallback(tick);
  p.v.ontimeupdate=()=>{if(active===i)sync()};
  p.v.onplay=p.v.onpause=p.v.onended=playLabel;
  new ResizeObserver(()=>fit(p)).observe(p.c);
  el.addEventListener('pointerdown',()=>setActive(i),true);
  p.c.addEventListener('pointerdown',e=>{
    if(!p.v.src||!$('#draw').open)return;
    p.c.setPointerCapture(e.pointerId);
    const n=nrm(p,e),col=$('#col').value;
    if(tool==='line')p.cur={t:'line',col,p:[n,n]};

/* 表示中のコマの番号。記録したコマの時刻(pts)から求める */
function curFrame(p,f){

    const bi=Math.max(0,ps.indexOf(panes[active]));

const SH={rel:a=>'基準 '+a+'コマ'};
function capText(){
  const a=panes[active],v=a.v;
  if(compare&&panes.every(q=>q.anchor!=null)){const n=Math.round((v.currentTime-a.anchor)*fps());return SH.rel((n>0?'+':n<0?'−':'±')+Math.abs(n))}

function shrink(o,maxW){
  if(o.width<=maxW)return o;
  const c=document.createElement('canvas'),s=maxW/o.width;c.width=maxW;c.height=Math.round(o.height*s);
  c.getContext('2d').drawImage(o,0,0,c.width,c.height);return c;
}
function buildSheet(sheet){
  const n=sheet.length;if(!n)return null;
  const cw=Math.max(480,Math.min(1280,Math.min(...sheet.map(i=>i.c.width))));
  const ch=Math.round(Math.max(...sheet.map(i=>cw/(i.c.width/i.c.height))));
  let cols=1,best=1e9;
  for(let k=1;k<=Math.min(n,4);k++){const r=Math.ceil(n/k),sc=Math.abs(Math.log((k*cw)/(r*ch)/0.9));if(sc<best-1e-9){best=sc;cols=k}}

  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d'),fs=Math.round(cw*0.045),font='"Hiragino Sans","Noto Sans JP",system-ui,sans-serif';
  x.fillStyle='#14201c';x.fillRect(0,0,W,H);
  sheet.forEach((it,k)=>{
    const X=g+(k%cols)*(cw+g),Y=g+Math.floor(k/cols)*(ch+g);
    const s=Math.min(cw/it.c.width,ch/it.c.height),w=Math.round(it.c.width*s),h=Math.round(it.c.height*s);
    const ox=X+Math.round((cw-w)/2),oy=Y+Math.round((ch-h)/2);
    x.drawImage(it.c,ox,oy,w,h);
    const r=Math.round(fs*0.75),cx=ox+r+6,cy=oy+r+6;
    x.fillStyle='rgba(20,32,28,.85)';x.beginPath();x.arc(cx,cy,r,0,7);x.fill();
    x.fillStyle='#ffffff';x.font='bold '+fs+'px '+font;x.textAlign='center';x.textBaseline='middle';x.fillText(String(k+1),cx,cy+1);
    if(it.tags){
      const ts2=Math.round(fs*0.8),pw2=Math.round(ts2*1.5),ph2=Math.round(ts2*1.4);
      it.tags.forEach(t=>{const rx=ox+Math.round(t.x*w)-pw2-6,ry=oy+6;
        x.fillStyle='rgba(255,210,63,.92)';x.fillRect(rx,ry,pw2,ph2);
        x.fillStyle='#14201c';x.font='bold '+ts2+'px '+font;x.textAlign='center';x.textBaseline='middle';x.fillText(t.l,rx+pw2/2,ry+ph2/2+1);x.textBaseline='alphabetic'});

}
/* ---- いま表示している場面を中心に、一定間隔の4枚を自動で集めて1枚に並べる ---- */
let bursting=false;

const SETTLE_MS=('requestVideoFrameCallback' in HTMLVideoElement.prototype)?60:200;  /* コマ到着を確認できないブラウザでは、少し長く待つ */
async function buildFour(clean){
  if(bursting)return;
  const ts=T().filter(p=>p.v.videoWidth);if(!ts.length)return;
  const f=fps(),iv=+$('#burstiv').value||5,btn=$(clean?'#aimain':'#m4'),lab=btn.textContent,ctl=['#m1','#m4','#aimain','#snap','#burstiv'].map($);
  aiPair=ts.length>1;
  bursting=true;ctl.forEach(e=>e.disabled=true);btn.textContent='作成中…';
  ts.forEach(p=>p.v.pause());
  let at=0;
  try{
    await settleP(ts);
    const cs=framesOf(ts,f),lo=-Math.min(...cs.map(c=>c.n)),hi=Math.min(...cs.map(c=>c.last-c.n));
    /* 表示中のコマ(0)は必ず入れる。前に2つ・後ろに1つが基本で、端に近いときは足りない側を反対側で補う */
    const mb=Math.floor(-lo/iv),ma=Math.floor(hi/iv);
    let nb=Math.min(2,mb),na=Math.min(ma,3-nb);nb=Math.min(mb,3-na);
    let ds=[];for(let k=-nb;k<=na;k++)ds.push(k*iv);
    if(ds.length<2){btn.dataset.keep='1';btn.textContent='動画の端に近すぎます';setTimeout(()=>{delete btn.dataset.keep;btn.textContent=lab},1800);return}
    const items=[];at=0;
    for(const d of ds){
      if(d!==at){goFrames(ts,f,d-at);at=d;await seekWait(ts);await settleP(ts);await new Promise(r=>setTimeout(r,SETTLE_MS))}
      const fr=ts.map(p=>frame(p,!clean)).filter(Boolean);if(!fr.length)continue;
      const h=Math.min(...fr.map(c=>c.height)),ws=fr.map(c=>c.width*h/c.height);
      const o=document.createElement('canvas');o.width=Math.round(ws.reduce((a,c)=>a+c));o.height=h;
      const x=o.getContext('2d');let off=0;fr.forEach((c,k)=>{x.drawImage(c,off,0,ws[k],h);off+=ws[k]});
      let tags=null;if(fr.length>1){let ac=0;const tw=ws.reduce((a,c)=>a+c);tags=fr.map((c,k)=>{ac+=ws[k];return{x:ac/tw,l:String.fromCharCode(65+k)}})}
      items.push({c:shrink(o,1600),cap:(d===0?'● ':'')+capText(),tags});
    }
    if(at!==0){goFrames(ts,f,-at);at=0;await seekWait(ts);await settleP(ts)}
    const cc=withCredit(buildSheet(items));view[clean?5:4]={cc,items,url:cc.toDataURL('image/png')};
  }finally{
    if(at!==0){try{goFrames(ts,f,-at);at=0}catch(e){}}  /* 途中で失敗しても、再生位置を元に戻す */
    bursting=false;ctl.forEach(e=>e.disabled=false);if(!btn.dataset.keep)btn.textContent=lab}
}

/* QRコード生成（外部ライブラリなし）。バイトモード・誤り訂正L・バージョン1〜4（URL 78文字まで）。収まらない場合は null */
function qrMatrix(text){
  const data=Array.from(new TextEncoder().encode(text));
  const CAP={1:[19,7],2:[34,10],3:[55,15],4:[80,20]};
  let ver=0;
  for(const v of [1,2,3,4]){if(data.length<=CAP[v][0]-2){ver=v;break}}

  const dcw=CAP[ver][0],ecn=CAP[ver][1],bits=[];
  const put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>i)&1)};
  put(4,4);put(data.length,8);data.forEach(b=>put(b,8));
  put(0,Math.min(4,dcw*8-bits.length));
  while(bits.length%8)bits.push(0);
  for(let p=0;bits.length<dcw*8;p++)put(p%2?0x11:0xEC,8);
  const cw=[];
  for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];cw.push(b)}
  const exp=new Array(512),log=new Array(256);
  let xv=1;
  for(let i=0;i<255;i++){exp[i]=xv;log[xv]=i;xv<<=1;if(xv&256)xv^=0x11D}
  for(let i=255;i<512;i++)exp[i]=exp[i-255];
  const mul=(a,b)=>a&&b?exp[log[a]+log[b]]:0;
  let g=[1];
  for(let i=0;i<ecn;i++){const ng=new Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=mul(g[j],exp[i])}g=ng}
  const ec=new Array(ecn).fill(0);
  for(const d of cw){const f=d^ec[0];ec.shift();ec.push(0);for(let j=0;j<ecn;j++)ec[j]^=mul(g[j+1],f)}
  const all=cw.concat(ec);
  const N=17+4*ver,M=[],F=[];
  for(let i=0;i<N;i++){M.push(new Array(N).fill(false));F.push(new Array(N).fill(false))}
  const set=(r,c,v)=>{M[r][c]=v;F[r][c]=true};
  const finder=(r,c)=>{for(let i=-1;i<=7;i++)for(let j=-1;j<=7;j++){
    const rr=r+i,cc=c+j;if(rr<0||cc<0||rr>=N||cc>=N)continue;
    set(rr,cc,(i>=0&&i<=6&&(j===0||j===6))||(j>=0&&j<=6&&(i===0||i===6))||(i>=2&&i<=4&&j>=2&&j<=4))}};
  finder(0,0);finder(0,N-7);finder(N-7,0);
  for(let i=8;i<N-8;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
  if(ver>=2){const p=4*ver+10;for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)set(p+i,p+j,Math.max(Math.abs(i),Math.abs(j))!==1)}
  for(let i=0;i<9;i++){if(i!==6){F[8][i]=true;F[i][8]=true}}
  for(let i=0;i<8;i++){F[8][N-1-i]=true;F[N-1-i][8]=true}
  set(N-8,8,true);
  const maskFn=[(r,c)=>(r+c)%2===0,(r,c)=>r%2===0,(r,c)=>c%3===0,(r,c)=>(r+c)%3===0,
    (r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2===0,(r,c)=>(r*c)%2+(r*c)%3===0,
    (r,c)=>((r*c)%2+(r*c)%3)%2===0,(r,c)=>((r*c)%3+(r+c)%2)%2===0];
  const build=m=>{
    const Q=M.map(r=>r.slice());
    let inc=-1,row=N-1,bi=7,by=0;
    for(let col=N-1;col>0;col-=2){
      if(col===6)col--;
      for(;;){
        for(let c=0;c<2;c++){
          if(!F[row][col-c]){
            let d=by<all.length?((all[by]>>bi)&1)===1:false;
            if(maskFn[m](row,col-c))d=!d;
            Q[row][col-c]=d;bi--;if(bi<0){by++;bi=7}
          }
        }

        if(row<0||row>=N){row-=inc;inc=-inc;break}
      }
    }

      if(i<8)Q[8][N-i-1]=v;else if(i<9)Q[8][15-i]=v;else Q[8][15-i-1]=v;
    }
    Q[N-8][8]=true;
    return Q;
  };
  const penalty=Q=>{
    let p=0;
    for(let t=0;t<2;t++){
      for(let a=0;a<N;a++){
        let run=1;
        for(let b=1;b<N;b++){
          const cur=t?Q[b][a]:Q[a][b],prev=t?Q[b-1][a]:Q[a][b-1];
          if(cur===prev){run++;if(run===5)p+=3;else if(run>5)p++}else run=1;
        }
      }
    }
    for(let r=0;r<N-1;r++)for(let c=0;c<N-1;c++){const v=Q[r][c];if(v===Q[r][c+1]&&v===Q[r+1][c]&&v===Q[r+1][c+1])p+=3}
    const pat=[true,false,true,true,true,false,true];
    for(let r=0;r<N;r++)for(let c=0;c<N-6;c++){
      for(let t=0;t<2;t++){
        let ok=true;
        for(let k=0;k<7&&ok;k++){const v=t?Q[c+k][r]:Q[r][c+k];if(v!==pat[k])ok=false}
        if(ok)p+=40;
      }
    }
    let dark=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(Q[r][c])dark++;
    p+=Math.floor(Math.abs(dark*100/(N*N)-50)/5)*10;
    return p;
  };
  let best=null,bp=1e9;
  for(let m=0;m<8;m++){const Q=build(m),p=penalty(Q);if(p<bp){bp=p;best=Q}}
  return best;
}
function withCredit(o){
  const bh=Math.round(Math.max(200,o.width*0.2)),c=document.createElement('canvas');
  c.width=o.width;c.height=o.height+bh;
  const x=c.getContext('2d');x.drawImage(o,0,0);
  x.fillStyle='#14201c';x.fillRect(0,o.height,c.width,bh);
  let full='';
  if(/^https?:$/.test(location.protocol))full=(location.origin+location.pathname).replace(/index\.html$/,'');
  const u=full.replace(/^https?:\/\//,''),pad=Math.round(bh*0.16),font='"Hiragino Sans","Noto Sans JP",system-ui,sans-serif';
  let textMax=o.width-pad*2;
  const q=full?qrMatrix(full):null;
  if(q){
    const n=q.length,m=Math.max(2,Math.floor(bh*0.9/(n+6))),side=m*(n+6);
    const qx=o.width-pad-side,qy=o.height+Math.round((bh-side)/2);
    x.fillStyle='#ffffff';x.fillRect(qx,qy,side,side);
    x.fillStyle='#000000';
    for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q[r][k])x.fillRect(qx+(k+3)*m,qy+(r+3)*m,m,m);
    textMax=qx-pad*2;
  }
  const fit=(t,size,weight)=>{x.font=weight+' '+size+'px '+font;while(x.measureText(t).width>textMax&&size>10){size--;x.font=weight+' '+size+'px '+font}return size};
  x.textBaseline='middle';x.textAlign='left';
  fit(APP_NAME,Math.round(bh*0.24),'bold');
  x.fillStyle='#ffffff';x.fillText(APP_NAME,pad,o.height+(q?bh*0.28:(u?bh*0.36:bh*0.5)));
  if(u){fit(u,Math.round(bh*0.15),'normal');x.fillStyle='#ffd23f';x.fillText(u,pad,o.height+(q?bh*0.55:bh*0.68))}
  if(q){fit(APP_HINT,Math.round(bh*0.12),'normal');x.fillStyle='#b9cbc1';x.fillText(APP_HINT,pad,o.height+bh*0.84)}
  return c;
}

function layout(){
  const box=$('#panes');if(!compare)return;
  const W=box.clientWidth,H=box.clientHeight,g=6,bar=44;
  if(!W||!H)return;
  const ar=p=>p.v.videoWidth&&p.v.videoHeight?p.v.videoWidth/p.v.videoHeight:16/9;
  const area=(w,h,a)=>{const dw=Math.max(0,Math.min(w,h*a));return dw*dw/a};
  const sum=(w,h)=>area(w,h,ar(panes[0]))+area(w,h,ar(panes[1]));
  const cols=sum((W-g)/2,H-bar),rows=sum(W,(H-g)/2-bar);
  box.classList.toggle('rows',rows>cols);
  panes.forEach(redraw);
}

let TUT=TUTS.basic;
let tutI=-1,tutTm=null;
function tutRect(sel){
  const L=[].concat(sel).map(q=>document.querySelector(q)).filter(e=>e&&(e.offsetParent!==null||getComputedStyle(e).position==='fixed'));
  if(!L.length)return null;
  L.forEach((e,i)=>{if(i===0){const r=e.getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)e.scrollIntoView({block:'center'})}});
  const R=L.map(e=>e.getBoundingClientRect());
  const l=Math.min(...R.map(r=>r.left)),t=Math.min(...R.map(r=>r.top)),rt=Math.max(...R.map(r=>r.right)),b=Math.max(...R.map(r=>r.bottom));
  return{left:l,top:t,width:rt-l,height:b-t};
}
const tutLS=v=>{try{localStorage.setItem('fn_tut','1')}catch(e){}};
function tutPlace(){
  if(tutI<0)return;const st=TUT[tutI];const mk=$('#tutmask'),cd=$('#tutcard');
  const q=tutRect(st.sel());
  if(!q){mk.style.display='none';return}
  const pad=6;mk.style.display='block';
  mk.style.left=(q.left-pad)+'px';mk.style.top=(q.top-pad)+'px';mk.style.width=(q.width+pad*2)+'px';mk.style.height=(q.height+pad*2)+'px';
  const mid=q.top+q.height/2;if(mid>innerHeight/2){cd.style.top='12px';cd.style.bottom='auto'}else{cd.style.bottom='12px';cd.style.top='auto'}
}
function tutShow(i){
  tutI=i;const st=TUT[i];let cd=$('#tutcard');
  cd.innerHTML='<h3></h3><p></p><div class="row"><span class="grow"></span><button id="tutskip">やめる</button><button class="go" id="tutnext"></button></div>';
  cd.querySelector('h3').textContent=String.fromCharCode(0x2460+i)+' '+st.t;cd.querySelector('p').textContent=st.m;
  cd.querySelector('.grow').textContent=(i+1)+' / '+TUT.length;
  const nx=$('#tutnext');nx.textContent=st.last?'完了':st.act?st.actlabel:'次へ';
  $('#tutskip').onclick=tutEnd;
  nx.onclick=()=>{if(st.last)return tutEnd();if(st.act&&!(st.done&&st.done()))st.act();else tutNext()};
  nx.disabled=!!(st.need&&!st.done());
  tutPlace();
}
function tutNext(){
  let i=tutI+1;
  while(i<TUT.length&&TUT[i].skipIf&&TUT[i].skipIf())i++;
  if(i>=TUT.length)return tutEnd();tutShow(i);
}
function tutStart(k){
  TUT=TUTS[k||'basic'];tutLS();$('#tutbn').hidden=true;$('#tutmask').hidden=false;$('#tutcard').hidden=false;
  let i=0;if(TUT[0].done())i=1;
  if(!$('#snapbox').hidden){$('#snapbox').hidden=true;closeAI()}
  tutShow(i);clearInterval(tutTm);
  tutTm=setInterval(()=>{
    if(tutI<0)return;const st=TUT[tutI];
    if(st.done&&st.done()&&!st.last){tutNext();return}
    const nx=$('#tutnext');if(nx&&st.need)nx.disabled=!st.done();
    tutPlace();
  },350);
}
function tutEnd(){
  clearInterval(tutTm);tutI=-1;$('#tutmask').hidden=true;$('#tutcard').hidden=true;
}
$('#tutbtn').onclick=()=>tutStart('basic');
$('#tutbtn2').onclick=()=>tutStart('cmp');
$('#tutgo').onclick=()=>tutStart('basic');
$('#tutno').onclick=()=>{tutLS();$('#tutbn').hidden=true};
addEventListener('resize',tutPlace);
try{if(!localStorage.getItem('fn_tut'))$('#tutbn').hidden=false}catch(e){$('#tutbn').hidden=false}
</script>
</body>
</html>
